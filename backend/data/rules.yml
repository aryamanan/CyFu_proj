version: "3.1"

rules:

- rule: Respond to greetings
  steps:
  - intent: greet
  - action: utter_greet

- rule: Respond to goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Handle recipe request
  steps:
  - intent: request_recipe
  - action: action_query_recipe_kb

- rule: Handle happy mood
  steps:
  - intent: mood_great
  - action: utter_happy

